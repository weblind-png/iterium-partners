
name: keepalive
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" \
            "https://tqrslayhdvpgndymxbab.supabase.co/rest/v1/experts?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
